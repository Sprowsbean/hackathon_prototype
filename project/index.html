<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atta prototype</title>
  <script src="./shared.js"></script>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #f1f5f9; color: #0f172a; font: 16px/1.5 system-ui, sans-serif }
    main { width: min(100%, 520px); padding: 28px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; box-shadow: 0 16px 40px rgb(15 23 42 / 10%) }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 12px }
    h1 { margin: 0; font-size: 26px; line-height: 1.1 }
    h1 small { display: block; font-size: 14px; font-weight: 500; color: #475569 }
    p { margin: 0 0 20px; color: #475569 }
    nav { display: grid; gap: 12px }
    a { display: block; padding: 14px 16px; border-radius: 12px; background: #1d3f8f; color: white; font-weight: 600; text-decoration: none }
    a:hover { background: #142c66 }
    a.alt { background: #e8eefb; color: #1d3f8f }
    a.alt:hover { background: #dce5f8 }
    a span { display: block; font-size: 13px; font-weight: 400; opacity: .85 }
    button { margin-top: 16px; border: 0; background: transparent; color: #1d3f8f; font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 8px 0 }
    #msg { font-size: 13px; color: #166534; margin-left: 8px }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg width="56" height="56" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#1D3F8F"></rect><path d="M13 35L24 12l11 23" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M18 27.5c3.6-3 8.4-3 12 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"></path><circle cx="24" cy="39" r="2.5" fill="#E2453C"></circle></svg>
      <h1>Atta<small>ID card &amp; passport services prototype</small></h1>
    </div>
    <p>Choose an app to preview. Citizen demo code: <b>123456</b>. Officer demo login: <b>OF-1024 / 1234</b>.</p>
    <nav aria-label="Prototype apps">
      <a href="./both.html">Both apps side by side<span>Officer actions update the citizen app live</span></a>
      <a class="alt" href="./Main.dc.html">Citizen app</a>
      <a class="alt" href="./Officer.dc.html">Officer app</a>
    </nav>
    <button type="button" id="reset">Reset demo data</button><span id="msg" role="status"></span>
  </main>
  <script>
    document.getElementById('reset').addEventListener('click', function () {
      window.AttaStore.reset();
      document.getElementById('msg').textContent = 'Sample data restored.';
    });
  </script>
</body>
</html>
